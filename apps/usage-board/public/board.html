<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1b2d">
<title>Usage Board</title>
<style>
:root{color-scheme:dark;--dial:#0f1b2d;--rim:#1a2b44;--line:#243650;--text:#ebe7dc;--muted:#8d9ab0;--faint:#5f6e86;--lume:#a6e3bf;--warning:#f0b252;--serious:#f0895e;--critical:#ff7466;--numeral:ui-rounded,"SF Pro Rounded",-apple-system,"Hiragino Sans",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--dial);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
main{height:100dvh;display:grid;grid-template-columns:288px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding:env(safe-area-inset-top) max(env(safe-area-inset-right),8px) env(safe-area-inset-bottom) max(env(safe-area-inset-left),8px)}
.panel{min-width:0;padding:14px 12px}
.limits{grid-row:1/3;display:flex;flex-direction:column;padding-bottom:10px;border-right:1px solid var(--line)}
.usage{grid-column:2;grid-row:1;padding-bottom:10px;border-bottom:1px solid var(--line);margin:0 4px}
.live{grid-column:2;grid-row:2;overflow-y:auto;padding-top:10px;margin:0 4px}
h3{font-size:13px;font-weight:600;margin:0 0 2px}
p{margin:0}
.note{font-size:12px;color:var(--muted)}
.faint{color:var(--faint)}
[data-stale="true"]{color:var(--serious)}
.dials{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;align-content:center}
.dial{text-align:center}
.gauge{position:relative;width:100%;max-width:128px;margin:0 auto 4px}
.face{display:block;width:100%;height:auto}
.ticks{stroke:var(--faint);stroke-width:1;stroke-linecap:round}
.track{fill:none;stroke:var(--rim);stroke-width:5;stroke-linecap:round}
.level{fill:none;stroke:var(--lume);stroke-width:5;stroke-linecap:round;filter:drop-shadow(0 0 3px color-mix(in srgb,var(--lume) 45%,transparent))}
.dial[data-tone="warning"] .level{stroke:var(--warning)}
.dial[data-tone="critical"] .level{stroke:var(--critical)}
.dial[data-tone="neutral"] .ticks{stroke:var(--line)}
.reading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:4px}
.dial[data-tone="warning"] .reading strong{color:var(--warning)}
.dial[data-tone="critical"] .reading strong{color:var(--critical)}
.spark li span{display:block;width:100%;border-radius:1px;background:var(--faint)}
.spark li[data-today="true"] span{background:var(--lume);box-shadow:0 0 6px color-mix(in srgb,var(--lume) 60%,transparent)}
.sessions{list-style:none;margin:0;padding:0}
.lead{font-size:18px;margin-bottom:4px}
.unavailable{grid-column:1/-1}
.dial .note{font:300 13px/1.3 var(--numeral);color:var(--muted);font-variant-numeric:tabular-nums}
.reading strong{font:200 40px/1 var(--numeral);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.value{display:inline-flex;align-items:flex-start}
.reading .pct{font:300 14px/1 var(--numeral);color:var(--muted);margin:3px 0 0 2px}
.reading .unit{font-size:12px;color:var(--muted)}
.figure{display:flex;align-items:baseline;gap:10px}
.unit{font-size:12px;color:var(--muted)}
.figure strong{font:200 44px/1 var(--numeral);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.figure .pending{font-size:22px}
.spark{list-style:none;margin:10px 0 0;padding:0;display:flex;align-items:flex-end;gap:3px;height:28px}
.spark li{flex:1;max-width:10px;height:100%;display:flex;align-items:flex-end}
.busy{display:flex;align-items:baseline;gap:6px;margin-bottom:10px}
.busy strong{font:200 32px/1 var(--numeral);color:var(--lume);font-variant-numeric:tabular-nums}
.sessions>li{display:flex;flex-direction:column;padding:8px 0 8px 10px;border-left:2px solid var(--warning);margin-bottom:8px}
.title{font-weight:600;overflow-wrap:anywhere}
.waiting{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.clock{display:flex;align-items:baseline;gap:8px}
.clock time{font:200 30px/1 var(--numeral);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock .date{font-size:12px;color:var(--muted)}
.system{display:grid;gap:6px;margin-top:8px}
.meter{display:grid;grid-template-columns:3.2em 1fr 2.8em;align-items:center;gap:8px}
.meter .track{height:3px;border-radius:2px;background:var(--rim);overflow:hidden}
.meter .track span{display:block;height:100%;background:var(--muted)}
.meter[data-tone="warning"] .track span{background:var(--warning)}
.meter[data-tone="critical"] .track span{background:var(--critical)}
.meter strong{font:300 13px/1 var(--numeral);text-align:right;font-variant-numeric:tabular-nums}
.meter[data-tone="warning"] strong{color:var(--warning)}
.meter[data-tone="critical"] strong{color:var(--critical)}
body[data-offline="true"] .limits::after{content:"更新できません";font-size:12px;color:var(--critical)}
@media (min-width:960px){
main{grid-template-columns:360px minmax(0,1fr)}
.dials{grid-template-columns:1fr;gap:32px}
.gauge{max-width:200px}
.dial h3{font-size:15px}
.dial .note{font-size:15px}
.reading strong{font-size:64px}
.figure strong{font-size:72px}
.spark{height:48px;gap:5px}
.spark li{max-width:14px}
body{font-size:16px}
}
</style>
</head>
<body>
<main><section class="panel limits"></section></main>
<!-- 描画の script と分けておくと、描画の script が壊れたファイルを読み込んでも、直したファイルをまた読み込み直せる -->
<script type="module">
const uiVersionPollMs = 5_000;
const fetchTimeoutMs = 10_000;
let loadedVersion;

async function checkUiVersion() {
  try {
    const response = await fetch("/api/ui-version", { cache: "no-store", signal: AbortSignal.timeout(fetchTimeoutMs) });
    if (!response.ok) return;
    const { version } = await response.json();
    if (loadedVersion === undefined) loadedVersion = version;
    else if (version !== loadedVersion) location.reload();
  } catch {}
}

checkUiVersion();
setInterval(checkUiVersion, uiVersionPollMs);
</script>
<script type="module">
const boardPollMs = 15_000;
const clockTickMs = 5_000;
const fetchTimeoutMs = 10_000;
const timeOfDay = { hour: "2-digit", minute: "2-digit", hourCycle: "h23" };
const dayOfWeek = { month: "numeric", day: "numeric", weekday: "short" };

function setAttributes(element, attributes) {
  for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, String(value));
  return element;
}

// セッション名などには HTML が入りうるので、文字列は Text ノードとしてだけ足す
function el(tag, attributes = {}, ...children) {
  const element = setAttributes(document.createElement(tag), attributes);
  element.append(...children.filter((child) => child !== null));
  return element;
}

function svg(tag, attributes = {}, ...children) {
  const element = setAttributes(document.createElementNS("http://www.w3.org/2000/svg", tag), attributes);
  element.append(...children.filter((child) => child !== null));
  return element;
}

function formatted(ms, timeZone, options) {
  return new Intl.DateTimeFormat("ja-JP", { timeZone, ...options }).format(ms);
}

function formatAgo(ms) {
  const seconds = Math.max(Math.floor(ms / 1000), 0);
  if (seconds < 60) return `${seconds}秒前`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}分前`;
  if (seconds < 86_400) return `${Math.floor(seconds / 3600)}時間前`;
  return `${Math.floor(seconds / 86_400)}日前`;
}

function formatUsd(amount) {
  return amount > 0 && amount < 0.01 ? "<$0.01" : `$${amount.toFixed(2)}`;
}

function costLabel(totals) {
  return `${formatUsd(totals.costUsd)}${totals.unpricedModels.length > 0 ? "+" : ""}`;
}

function remainingClock(ms) {
  const minutes = Math.max(Math.floor(ms / 60_000), 0);
  const hours = Math.floor(minutes / 60);
  if (hours >= 24) return `${Math.floor(hours / 24)}日${hours % 24}時間`;
  return `${hours}:${String(minutes % 60).padStart(2, "0")}`;
}

const dialSweep = 75;
const dialTicks = Array.from({ length: 51 }, (_, index) => {
  const angle = ((135 + (index * 270) / 50) * Math.PI) / 180;
  const inner = index % 10 === 0 ? 43 : 46;
  const point = (radius) => `${(60 + radius * Math.cos(angle)).toFixed(2)} ${(60 + radius * Math.sin(angle)).toFixed(2)}`;
  return `M${point(inner)}L${point(49)}`;
}).join("");

function dialFace(remaining) {
  const filled = remaining === null ? 0 : (dialSweep * remaining) / 100;
  const arc = { cx: 60, cy: 60, r: 54, pathLength: 100, transform: "rotate(135 60 60)" };
  return svg(
    "svg",
    { class: "face", viewBox: "0 0 120 120", "aria-hidden": "true" },
    svg("path", { class: "ticks", d: dialTicks }),
    svg("circle", { class: "track", ...arc, "stroke-dasharray": `${dialSweep} 100` }),
    filled > 0 ? svg("circle", { class: "level", ...arc, "stroke-dasharray": `${filled.toFixed(2)} 100` }) : null,
  );
}

function dial(title, rateWindow, board) {
  if (rateWindow.state !== "active") {
    const reset = rateWindow.state === "reset";
    return el(
      "section",
      { class: "dial", "data-tone": "neutral" },
      el("div", { class: "gauge" }, dialFace(reset ? 100 : null), el("p", { class: "reading" }, el("span", { class: "unit" }, reset ? "リセット済み" : "値なし"))),
      el("h3", {}, title),
    );
  }
  const remaining = Math.max(0, Math.min(100, 100 - rateWindow.usedPercentage));
  const tone = remaining < 5 ? "critical" : remaining < 20 ? "warning" : "good";
  return el(
    "section",
    { class: "dial", "data-tone": tone, title: `${formatted(rateWindow.resetsAtMs, board.timeZone, { month: "numeric", day: "numeric", ...timeOfDay })} にリセット` },
    el(
      "div",
      { class: "gauge", role: "meter", "aria-label": `${title}の残り`, "aria-valuemin": 0, "aria-valuemax": 100, "aria-valuenow": Math.round(remaining) },
      dialFace(remaining),
      el("p", { class: "reading" }, el("span", { class: "value" }, el("strong", {}, String(Math.round(remaining))), el("span", { class: "pct" }, "%"))),
    ),
    el("h3", {}, title),
    el("p", { class: "note" }, `あと ${remainingClock(rateWindow.resetsAtMs - board.generatedAtMs)}`),
  );
}

function clockFace(timeZone, ms) {
  return el(
    "p",
    { class: "clock" },
    el("time", { id: "clock", "data-time-zone": timeZone }, formatted(ms, timeZone, timeOfDay)),
    el("span", { class: "date" }, formatted(ms, timeZone, dayOfWeek)),
  );
}

function tick() {
  const clock = document.querySelector(".clock");
  if (clock !== null) clock.replaceWith(clockFace(clock.querySelector("time").dataset.timeZone, Date.now()));
}

function systemMeter(label, percentage) {
  const tone = percentage === null ? "neutral" : percentage >= 95 ? "critical" : percentage >= 85 ? "warning" : "good";
  return el(
    "p",
    { class: "meter", "data-tone": tone },
    el("span", { class: "unit" }, label),
    el("span", { class: "track" }, el("span", { style: `width:${Number(percentage ?? 0)}%` })),
    el("strong", {}, percentage === null ? "-" : `${percentage}%`),
  );
}

function limitsPanel(board) {
  const { rateLimits } = board;
  const clock = clockFace(board.timeZone, board.generatedAtMs);
  const system = el("div", { class: "system" }, systemMeter("メモリ", board.system.memoryUsedPercentage), systemMeter("CPU", board.system.cpuBusyPercentage));
  if (rateLimits.status === "unavailable") {
    return el(
      "section",
      { class: "panel limits" },
      clock,
      el("div", { class: "dials" }, el("div", { class: "unavailable" }, el("p", { class: "lead" }, "残りを取得できません"), el("p", { class: "note" }, rateLimits.reason))),
      system,
    );
  }
  const age = board.generatedAtMs - rateLimits.capturedAtMs;
  return el(
    "section",
    { class: "panel limits" },
    clock,
    el("div", { class: "dials" }, dial("5時間枠", rateLimits.fiveHour, board), dial("週の枠", rateLimits.sevenDay, board)),
    age > 15 * 60_000 ? el("p", { class: "note", "data-stale": "true" }, `${formatAgo(age)}のデータ`) : null,
    system,
  );
}

function weekday(date) {
  return formatted(Date.parse(`${date}T00:00:00Z`), "UTC", { weekday: "short" });
}

function sparkBar(day, maxCost, isToday) {
  const height = maxCost > 0 ? Math.max((day.totals.costUsd / maxCost) * 100, 3) : 3;
  const [, month, date] = day.date.split("-");
  return el(
    "li",
    { ...(isToday ? { "data-today": "true" } : {}), title: `${Number(month)}/${Number(date)}（${weekday(day.date)}） ${costLabel(day.totals)}` },
    el("span", { style: `height:${height.toFixed(1)}%` }),
  );
}

function usagePanel(board) {
  if (board.usage.status === "loading") {
    return el("section", { class: "panel usage" }, el("p", { class: "figure" }, el("span", { class: "unit" }, "今日"), el("strong", { class: "pending" }, "集計中")));
  }
  const { days } = board.usage.summary;
  const today = days.at(-1);
  const maxCost = Math.max(...days.map((day) => day.totals.costUsd));
  const unpriced = [...new Set(days.flatMap((day) => day.totals.unpricedModels))];
  return el(
    "section",
    { class: "panel usage" },
    el("p", { class: "figure", title: "API の定価で換算した推定額" }, el("span", { class: "unit" }, "今日"), el("strong", {}, today === undefined ? "-" : costLabel(today.totals))),
    el("ol", { class: "spark", "aria-label": `${days.length}日間の金額` }, ...days.map((day, index) => sparkBar(day, maxCost, index === days.length - 1))),
    unpriced.length > 0 ? el("p", { class: "note" }, `単価不明: ${unpriced.join(", ")}（金額に含めていない）`) : null,
  );
}

function waitingRow(session) {
  return el(
    "li",
    {},
    el("span", { class: "title" }, session.name ?? session.project ?? session.sessionId.slice(0, 8)),
    session.waitingFor === null ? null : el("span", { class: "waiting" }, session.waitingFor),
  );
}

function livePanel(board) {
  const waiting = board.live.filter((session) => session.status === "waiting");
  const busy = board.live.filter((session) => session.status === "busy").length;
  return el(
    "section",
    { class: "panel live" },
    el("p", { class: "busy" }, el("strong", {}, String(busy)), " ", el("span", { class: "unit" }, "実行中")),
    waiting.length === 0 ? null : el("ul", { class: "sessions", "aria-label": "入力待ち" }, ...waiting.map(waitingRow)),
  );
}

function show(board) {
  const current = document.querySelector("main");
  const scrollTops = new Map(Array.from(current.querySelectorAll(".panel"), (panel) => [panel.className, panel.scrollTop]));
  const next = el("main", {}, limitsPanel(board), livePanel(board), usagePanel(board));
  current.replaceWith(next);
  for (const panel of next.querySelectorAll(".panel")) panel.scrollTop = scrollTops.get(panel.className) ?? 0;
}

async function refresh() {
  try {
    const response = await fetch("/api/board", { cache: "no-store", signal: AbortSignal.timeout(fetchTimeoutMs) });
    if (!response.ok) throw new Error(String(response.status));
    show(await response.json());
    document.body.dataset.offline = "false";
  } catch {
    document.body.dataset.offline = "true";
  }
}

refresh();
setInterval(refresh, boardPollMs);
setInterval(tick, clockTickMs);
</script>
</body>
</html>
