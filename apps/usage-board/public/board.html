<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#102444">
<title>Usage Board</title>
<style>
:root{color-scheme:dark;--text:#f2ede4;--name:#f6f1e8;--sub:rgba(242,237,228,.76);--run:rgba(242,237,228,.64);--lab:rgba(242,237,228,.6);--wait:#f3b65a;--live:#9fdcb8;--low:#ff8f70;--num:ui-rounded,"SF Pro Rounded",-apple-system,"Hiragino Sans",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#102444;color:var(--text);font:14px/1.4 -apple-system,"Hiragino Sans",sans-serif;overflow:hidden}
p{margin:0}
.n{font-family:var(--num);font-variant-numeric:tabular-nums}
main{--used:0%;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:max(env(safe-area-inset-top),22px) max(env(safe-area-inset-right),28px) max(env(safe-area-inset-bottom),16px) max(env(safe-area-inset-left),28px);background:linear-gradient(to bottom,#511618 0px,#3d1418 calc(var(--used) * .55),#2a1419 max(0px,calc(var(--used) - 14px)),#1d2438 var(--used),#2a5689 calc(var(--used) + 6px),#1d3f6c calc(var(--used) + 40px),#102444 100%)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.clock{font-size:30px;font-weight:300;line-height:1;color:rgba(242,237,228,.74);margin-left:-3px}
.notice{display:flex;gap:10px;font-size:11px;line-height:1;color:var(--lab);white-space:nowrap}
body[data-offline="true"] .notice{color:var(--low)}
body[data-offline="true"] .notice::after{content:"更新できません"}
.sessions{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:20px;row-gap:8px;align-content:start;align-items:start;overflow-y:auto;scrollbar-width:none}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;flex:none}
.name{display:flex;align-items:center;gap:7px;font-size:22px;font-weight:600;line-height:26px;color:var(--name);white-space:nowrap}
.name .dot{background:var(--wait);width:7px;height:7px}
.name span:last-child,.running span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.waiting-for{font-size:17px;line-height:22px;color:var(--sub);padding-left:14px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:auto-phrase}
.running{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:var(--run);white-space:nowrap}
.running .dot{background:var(--live);width:5px;height:5px;margin:0 1px 0 0}
.waiting+.running{grid-column-start:1}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:6px}
.plans{display:flex;align-items:flex-end;gap:30px}
.plan{display:flex;flex-direction:column;justify-content:space-between;height:70px;width:182px}
.plan:last-child{width:196px}
.plan-head{display:flex;align-items:baseline;gap:10px;font-size:13px;line-height:1;color:var(--lab);white-space:nowrap}
.plan-head .reset{font-size:15px;color:rgba(242,237,228,.76)}
.dial{display:flex;align-items:flex-end}
.gauge{display:block;overflow:visible;margin-left:-5px}
.needle{fill:var(--name)}
.reading{font-size:33px;font-weight:300;line-height:1;margin:0 0 2px 7px}
.reading small{font-size:14px;color:var(--lab);margin-left:1px}
.plan[data-low="true"] .reading{color:var(--low)}
.plan[data-low="true"] .needle{fill:var(--low)}
.mac{display:grid;grid-template-columns:auto 84px auto;column-gap:10px;row-gap:14px;align-items:center;font-size:13px;line-height:1;color:var(--lab);margin-bottom:-1px}
.bar{height:3px;background:rgba(242,237,228,.16);border-radius:2px}
.bar span{display:block;height:100%;background:rgba(242,237,228,.7);border-radius:2px}
.mac strong{font-weight:400;font-size:15px;text-align:right;color:rgba(242,237,228,.78)}
@media (min-width:960px) and (min-height:640px){main>*{zoom:1.5}}
</style>
</head>
<body>
<main><header class="top"><p class="clock n"><time id="clock"></time></p><p class="notice"></p></header></main>
<!-- 描画の script と分けておくと、描画の script が壊れたファイルを読み込んでも、直したファイルをまた読み込み直せる -->
<script type="module">
const uiVersionPollMs = 5_000;
const fetchTimeoutMs = 10_000;
let loadedVersion;

async function checkUiVersion() {
  try {
    const response = await fetch("/api/ui-version", { cache: "no-store", signal: AbortSignal.timeout(fetchTimeoutMs) });
    if (!response.ok) return;
    const { version } = await response.json();
    if (loadedVersion === undefined) loadedVersion = version;
    else if (version !== loadedVersion) location.reload();
  } catch {}
}

checkUiVersion();
setInterval(checkUiVersion, uiVersionPollMs);
</script>
<script type="module">
const boardPollMs = 15_000;
const clockTickMs = 5_000;
const fetchTimeoutMs = 10_000;
const staleMs = 15 * 60_000;
const lowRemaining = 15;
const timeOfDay = { hour: "numeric", minute: "2-digit", hourCycle: "h23" };
const rateWindows = [
  { key: "fiveHour", title: "5時間枠", lengthMs: 5 * 3_600_000, resetFormat: timeOfDay },
  { key: "sevenDay", title: "週の枠", lengthMs: 7 * 86_400_000, resetFormat: { month: "numeric", day: "numeric", ...timeOfDay } },
];

function setAttributes(element, attributes) {
  for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, String(value));
  return element;
}

// セッション名などには HTML が入りうるので、文字列は Text ノードとしてだけ足す
function el(tag, attributes = {}, ...children) {
  const element = setAttributes(document.createElement(tag), attributes);
  element.append(...children.filter((child) => child !== null));
  return element;
}

function svg(tag, attributes = {}, ...children) {
  const element = setAttributes(document.createElementNS("http://www.w3.org/2000/svg", tag), attributes);
  element.append(...children.filter((child) => child !== null));
  return element;
}

function formatted(ms, timeZone, options) {
  return new Intl.DateTimeFormat("ja-JP", { timeZone, ...options }).format(ms);
}

function formatAgo(ms) {
  const seconds = Math.max(Math.floor(ms / 1000), 0);
  if (seconds < 60) return `${seconds}s ago`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  if (seconds < 86_400) return `${Math.floor(seconds / 3600)}h ago`;
  return `${Math.floor(seconds / 86_400)}d ago`;
}

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

function evenPaceRemaining(rateWindow, lengthMs, nowMs) {
  return clamp((rateWindow.resetsAtMs - nowMs) / lengthMs, 0, 1) * 100;
}

const gaugeRadius = 76 * 0.54;
const gaugePad = 5;
const fixed = (n) => n.toFixed(2);

function gaugePoint(percentage, radius) {
  const center = gaugeRadius + gaugePad;
  const angle = Math.PI * (1 - percentage / 100);
  return [center + radius * Math.cos(angle), center - radius * Math.sin(angle)];
}

function gaugeArc(from, to) {
  const [x0, y0] = gaugePoint(from, gaugeRadius);
  const [x1, y1] = gaugePoint(to, gaugeRadius);
  return `M${fixed(x0)},${fixed(y0)} A${fixed(gaugeRadius)},${fixed(gaugeRadius)} 0 0 1 ${fixed(x1)},${fixed(y1)}`;
}

function gaugeLine(percentage, inner, outer, attributes) {
  const [x1, y1] = gaugePoint(percentage, inner);
  const [x2, y2] = gaugePoint(percentage, outer);
  return svg("line", { x1: fixed(x1), y1: fixed(y1), x2: fixed(x2), y2: fixed(y2), "stroke-linecap": "round", ...attributes });
}

function needle(percentage) {
  const center = gaugeRadius + gaugePad;
  const [tipX, tipY] = gaugePoint(percentage, gaugeRadius - 4);
  const [tailX, tailY] = gaugePoint(percentage, -5);
  const angle = Math.PI * (1 - percentage / 100);
  const [nx, ny] = [Math.sin(angle) * 1.9, Math.cos(angle) * 1.9];
  const points = [[tipX, tipY], [center + nx, center + ny], [tailX, tailY], [center - nx, center - ny]];
  return [
    svg("polygon", { class: "needle", points: points.map(([x, y]) => `${fixed(x)},${fixed(y)}`).join(" ") }),
    svg("circle", { class: "hub", cx: fixed(center), cy: fixed(center), r: 3.4, fill: "#f6f1e8" }),
    svg("circle", { cx: fixed(center), cy: fixed(center), r: 1.3, fill: "rgba(20,16,20,.85)" }),
  ];
}

function gauge(remaining, pace) {
  const center = gaugeRadius + gaugePad;
  const ticks = Array.from({ length: 11 }, (_, index) => {
    const major = index % 5 === 0;
    return gaugeLine(index * 10, gaugeRadius - (major ? 7 : 4), gaugeRadius, { stroke: `rgba(242,237,228,${major ? 0.78 : 0.42})`, "stroke-width": major ? 1.4 : 1 });
  });
  return svg(
    "svg",
    { class: "gauge", width: fixed(2 * center), height: fixed(center + 4), "aria-hidden": "true" },
    svg("path", { d: gaugeArc(0, 100), fill: "none", stroke: "rgba(242,237,228,.16)", "stroke-width": 1 }),
    svg("path", { d: gaugeArc(0, lowRemaining), fill: "none", stroke: "rgba(255,143,112,.55)", "stroke-width": 2 }),
    ...ticks,
    pace === null ? null : gaugeLine(pace, gaugeRadius - 9, gaugeRadius + 3, { class: "pace", stroke: "#ffffff", "stroke-width": 2.4 }),
    ...(remaining === null ? [] : needle(remaining)),
  );
}

function plan({ title, lengthMs, resetFormat }, rateWindow, board) {
  const known = rateWindow.state !== "absent";
  const remaining = rateWindow.state === "active" ? Math.round(clamp(100 - rateWindow.usedPercentage, 0, 100)) : known ? 100 : null;
  const pace = rateWindow.state === "active" ? evenPaceRemaining(rateWindow, lengthMs, board.generatedAtMs) : null;
  const meter = remaining === null ? {} : { role: "meter", "aria-label": `${title}の残り`, "aria-valuemin": 0, "aria-valuemax": 100, "aria-valuenow": remaining };
  return el(
    "section",
    { class: "plan", "data-low": remaining !== null && remaining <= lowRemaining, ...meter },
    el(
      "p",
      { class: "plan-head" },
      el("span", { class: "label" }, title),
      known ? el("span", { class: "reset n" }, `↻ ${formatted(rateWindow.resetsAtMs, board.timeZone, resetFormat)}`) : null,
    ),
    el("div", { class: "dial" }, gauge(remaining, pace), el("p", { class: "reading n" }, ...(remaining === null ? ["-"] : [String(remaining), el("small", {}, "%")]))),
  );
}

function sessionName(session) {
  return session.name ?? session.project ?? session.sessionId.slice(0, 8);
}

function dot() {
  return el("span", { class: "dot", "aria-hidden": "true" });
}

function waitingItem(session) {
  return el(
    "li",
    { class: "waiting" },
    el("p", { class: "name" }, dot(), el("span", {}, sessionName(session))),
    session.waitingFor === null ? null : el("p", { class: "waiting-for" }, session.waitingFor),
  );
}

function runningItem(session) {
  return el("li", { class: "running" }, dot(), el("span", {}, sessionName(session)));
}

function sessionList(board) {
  const waiting = board.live.filter((session) => session.status === "waiting");
  const running = board.live.filter((session) => session.status === "busy");
  return el("ul", { class: "sessions" }, ...waiting.map(waitingItem), ...running.map(runningItem));
}

function macLine(label, percentage) {
  return [
    el("span", { class: "label" }, label),
    el("span", { class: "bar" }, el("span", { style: `width:${Number(percentage ?? 0)}%` })),
    el("strong", { class: "n" }, percentage === null ? "-" : `${percentage}%`),
  ];
}

function top(board) {
  const { rateLimits } = board;
  const age = rateLimits.status === "available" ? board.generatedAtMs - rateLimits.capturedAtMs : 0;
  return el(
    "header",
    { class: "top" },
    el("p", { class: "clock n" }, el("time", { id: "clock", "data-time-zone": board.timeZone }, formatted(board.generatedAtMs, board.timeZone, timeOfDay))),
    el("p", { class: "notice" }, age > staleMs ? el("span", { "data-stale": "true" }, `update: ${formatAgo(age)}`) : null),
  );
}

function bottom(board) {
  const { rateLimits, system } = board;
  const windowOf = (key) => (rateLimits.status === "available" ? rateLimits[key] : { state: "absent" });
  return el(
    "footer",
    { class: "bottom" },
    el("div", { class: "plans" }, ...rateWindows.map((rateWindow) => plan(rateWindow, windowOf(rateWindow.key), board))),
    el("div", { class: "mac" }, ...macLine("メモリ", system.memoryUsedPercentage), ...macLine("CPU", system.cpuBusyPercentage)),
  );
}

function skyUsed(rateLimits) {
  return rateLimits.status === "available" && rateLimits.fiveHour.state === "active" ? clamp(rateLimits.fiveHour.usedPercentage, 0, 100) : 0;
}

function tick() {
  const clock = document.querySelector("#clock");
  const { timeZone } = clock?.dataset ?? {};
  if (timeZone !== undefined) clock.textContent = formatted(Date.now(), timeZone, timeOfDay);
}

function show(board) {
  const current = document.querySelector("main");
  const scrollTop = current.querySelector(".sessions")?.scrollTop ?? 0;
  const next = el("main", {}, top(board), sessionList(board), bottom(board));
  next.style.setProperty("--used", `${skyUsed(board.rateLimits)}%`);
  current.replaceWith(next);
  next.querySelector(".sessions").scrollTop = scrollTop;
}

async function refresh() {
  try {
    const response = await fetch("/api/board", { cache: "no-store", signal: AbortSignal.timeout(fetchTimeoutMs) });
    if (!response.ok) throw new Error(String(response.status));
    show(await response.json());
    document.body.dataset.offline = "false";
  } catch {
    document.body.dataset.offline = "true";
  }
}

refresh();
setInterval(refresh, boardPollMs);
setInterval(tick, clockTickMs);
</script>
</body>
</html>
